; Optional settings for Hotline Anywhere City. Put this file next to HotlineCity.asi (GTA 2\scripts).
[paths]
; Your Hotline Miami folder. Melty fills this in for you; only needed for a manual install.
hotline_miami=

[display]
; 1 = borderless window covering the whole monitor (instant Alt+Tab, keeps running in the background)
; 0 = leave the window as GTA 2 / the window wrapper made it
borderless=1
